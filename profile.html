<!-- =====================================================
     PROFILE
===================================================== -->

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7 col-md-9">


                <!-- PROFILE CARD -->

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4 p-md-5">


                        <!-- PROFILE HEADER -->

                        <div class="text-center mb-4">

                            <div
                                class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                                style="width:90px;height:90px;">

                                <i class="bi bi-person-fill fs-1"></i>

                            </div>


                            <h2 class="fw-bold mt-3">
                                My Profile
                            </h2>

                            <p class="text-muted">
                                Manage your account information
                            </p>

                        </div>



                        <!-- SUCCESS MESSAGE -->

                        <div
                            id="successMessage"
                            class="alert alert-success d-none">

                            <i class="bi bi-check-circle"></i>

                            Profile updated successfully.

                        </div>



                        <!-- ERROR MESSAGE -->

                        <div
                            id="errorMessage"
                            class="alert alert-danger d-none">

                        </div>



                        <!-- PROFILE FORM -->

                        <form id="profileForm">


                            <!-- FULL NAME -->

                            <div class="mb-3">

                                <label
                                    for="fullName"
                                    class="form-label fw-semibold">

                                    Full Name

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="bi bi-person"></i>

                                    </span>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="fullName"
                                        placeholder="Enter your full name"
                                        required>

                                </div>

                            </div>



                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold">

                                    Email Address

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="bi bi-envelope"></i>

                                    </span>

                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        readonly>

                                </div>

                                <small class="text-muted">

                                    Your email address is managed by
                                    your account authentication.

                                </small>

                            </div>



                            <!-- PHONE -->

                            <div class="mb-3">

                                <label
                                    for="phone"
                                    class="form-label fw-semibold">

                                    Phone Number

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="bi bi-telephone"></i>

                                    </span>

                                    <input
                                        type="tel"
                                        class="form-control"
                                        id="phone"
                                        placeholder="Enter 10-digit phone number"
                                        maxlength="10">

                                </div>

                            </div>



                            <!-- USERNAME -->

                            <div class="mb-4">

                                <label
                                    for="username"
                                    class="form-label fw-semibold">

                                    Username

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="bi bi-at"></i>

                                    </span>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="username"
                                        placeholder="Enter username">

                                </div>

                            </div>



                            <!-- UPDATE BUTTON -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                                id="updateButton">

                                <i class="bi bi-save"></i>

                                Update Profile

                            </button>


                        </form>


                        <!-- ACCOUNT ACTIONS -->

                        <hr class="my-4">


                        <div class="row g-2">

                            <div class="col-md-6">

                                <a
                                    href="my-orders.html"
                                    class="btn btn-outline-primary w-100">

                                    <i class="bi bi-box-seam"></i>

                                    My Orders

                                </a>

                            </div>


                            <div class="col-md-6">

                                <a
                                    href="cart.html"
                                    class="btn btn-outline-secondary w-100">

                                    <i class="bi bi-cart3"></i>

                                    My Cart

                                </a>

                            </div>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
