
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - MediCare Pharmacy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            💊 MediCare Pharmacy
        </a>
        <a href="login.html" class="btn btn-light text-primary">
            Customer Login
        </a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <div class="fs-1">🔐</div>
                        <h2 class="fw-bold">Owner Login</h2>
                        <p class="text-muted">
                            Sign in to manage MediCare Pharmacy
                        </p>
                    </div>

                    <div id="loginError"
                         class="alert alert-danger d-none"
                         role="alert"></div>

                    <form id="ownerLoginForm">
                        <div class="mb-3">
                            <label for="ownerEmail" class="form-label">
                                Owner Email
                            </label>
                            <input
                                type="email"
                                id="ownerEmail"
                                class="form-control"
                                placeholder="Enter owner email"
                                autocomplete="username"
                                required>
                        </div>

                        <div class="mb-4">
                            <label for="ownerPassword" class="form-label">
                                Password
                            </label>
                            <input
                                type="password"
                                id="ownerPassword"
                                class="form-control"
                                placeholder="Enter password"
                                autocomplete="current-password"
                                required>
                        </div>

                        <button
                            type="submit"
                            id="ownerLoginButton"
                            class="btn btn-primary btn-lg w-100">
                            Sign In as Owner
                        </button>
                    </form>

                    <p class="text-muted small mt-4 mb-0">
                        Access is restricted to an authorized owner account.
                    </p>

                    <div class="text-center mt-3">
                        <a href="index.html">Back to Home</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js"></script>

<script>
const form = document.getElementById("ownerLoginForm");
const errorBox = document.getElementById("loginError");
const button = document.getElementById("ownerLoginButton");

function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove("d-none");
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    errorBox.classList.add("d-none");
    button.disabled = true;
    button.textContent = "Verifying owner...";

    let signedIn = false;

    try {
        // Check that the existing Supabase configuration is loaded.
        if (typeof db === "undefined" || !db.auth) {
            throw new Error("Supabase configuration did not load.");
        }

        const email = document.getElementById("ownerEmail").value.trim();
        const password = document.getElementById("ownerPassword").value;

        // Step 1: Authenticate with Supabase Auth.
        const { data, error } = await db.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            throw new Error("Sign-in failed. Check your email and password.");
        }

        signedIn = true;

        if (!data.user) {
            throw new Error("Unable to verify the signed-in account.");
        }

        // Step 2: Check the owner's role in the database.
        // The profiles table and its RLS policies must be configured securely.
        const { data: profile, error: profileError } = await db
            .from("profiles")
            .select("role")
            .eq("id", data.user.id)
            .maybeSingle();

        if (profileError || !profile || profile.role !== "owner") {
            // Do not leave an unauthorized account signed in.
            await db.auth.signOut();
            signedIn = false;

            throw new Error(
                "This account is not authorized for owner access."
            );
        }

        // Step 3: Redirect only after the owner role is confirmed.
        window.location.replace("owner-dashboard.html");

    } catch (error) {
        // Clean up any session if verification failed.
        if (signedIn) {
            try {
                await db.auth.signOut();
            } catch (_) {
                // Do not display internal error details.
            }
        }

        showError(
            error.message === "Supabase configuration did not load."
                ? "Connection setup failed. Check your Supabase configuration."
                : error.message || "Unable to sign in. Please try again."
        );

    } finally {
        button.disabled = false;
        button.textContent = "Sign In as Owner";
    }
});
</script>

</body>
</html>
