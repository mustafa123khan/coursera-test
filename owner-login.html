
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - MediCare Pharmacy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            💊 MediCare Pharmacy
        </a>
        <a href="login.html" class="btn btn-light text-primary">
            Customer Login
        </a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <div class="fs-1">🔐</div>
                        <h2 class="fw-bold">Owner Login</h2>
                        <p class="text-muted">
                            Sign in to manage MediCare Pharmacy
                        </p>
                    </div>

                    <div id="loginError" class="alert alert-danger d-none"></div>

                    <form id="ownerLoginForm">
                        <div class="mb-3">
                            <label for="ownerEmail" class="form-label">
                                Owner Email
                            </label>
                            <input
                                type="email"
                                id="ownerEmail"
                                class="form-control"
                                placeholder="Enter owner email"
                                autocomplete="username"
                                required>
                        </div>

                        <div class="mb-4">
                            <label for="ownerPassword" class="form-label">
                                Password
                            </label>
                            <input
                                type="password"
                                id="ownerPassword"
                                class="form-control"
                                placeholder="Enter password"
                                autocomplete="current-password"
                                required>
                        </div>

                        <button
                            type="submit"
                            id="ownerLoginButton"
                            class="btn btn-primary btn-lg w-100">
                            Sign In as Owner
                        </button>
                    </form>

                    <p class="text-muted small mt-4 mb-0">
                        Access is restricted to an authorized owner account.
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js"></script>

<script>
const form = document.getElementById("ownerLoginForm");
const errorBox = document.getElementById("loginError");
const button = document.getElementById("ownerLoginButton");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    errorBox.classList.add("d-none");
    button.disabled = true;
    button.textContent = "Checking account...";

    try {
        const email = document.getElementById("ownerEmail").value.trim();
        const password = document.getElementById("ownerPassword").value;

        const { data, error } = await db.auth.signInWithPassword({
            email,
            password
        });

        if (error) throw error;

        // This server-side/RLS-protected role check must be configured
        // before the owner dashboard can be considered secure.
        const { data: profile, error: profileError } = await db
            .from("profiles")
            .select("role")
            .eq("id", data.user.id)
            .single();

        if (profileError || profile?.role !== "owner") {
            await db.auth.signOut();
            throw new Error("This account is not authorized for owner access.");
        }

        window.location.href = "owner-dashboard.html";
    } catch (error) {
        errorBox.textContent = error.message ||
            "Unable to sign in. Please try again.";
        errorBox.classList.remove("d-none");
    } finally {
        button.disabled = false;
        button.textContent = "Sign In as Owner";
    }
});
</script>

</body>
</html>
