
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - MediCare Pharmacy</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-capsule"></i> MediCare Pharmacy
            </a>
        </div>
    </nav>

    <!-- PASSWORD RESET -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">

                    <div class="card shadow border-0">
                        <div class="card-body p-4 p-md-5">

                            <div class="text-center mb-4">
                                <div
                                    class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                                    style="width:70px;height:70px;">
                                    <i class="bi bi-shield-lock fs-2"></i>
                                </div>

                                <h2 class="fw-bold mt-3">Reset Password</h2>

                                <p class="text-muted">
                                    Enter your new password below.
                                </p>
                            </div>

                            <div
                                id="message"
                                class="alert d-none"
                                role="alert">
                            </div>

                            <form id="resetForm" class="d-none">

                                <div class="mb-3">
                                    <label for="newPassword"
                                        class="form-label fw-bold">
                                        New Password
                                    </label>

                                    <input
                                        type="password"
                                        id="newPassword"
                                        class="form-control"
                                        minlength="8"
                                        autocomplete="new-password"
                                        placeholder="Enter new password"
                                        required>

                                    <small class="text-muted">
                                        Use at least 8 characters.
                                    </small>
                                </div>

                                <div class="mb-4">
                                    <label for="confirmPassword"
                                        class="form-label fw-bold">
                                        Confirm New Password
                                    </label>

                                    <input
                                        type="password"
                                        id="confirmPassword"
                                        class="form-control"
                                        minlength="8"
                                        autocomplete="new-password"
                                        placeholder="Confirm new password"
                                        required>
                                </div>

                                <button
                                    type="submit"
                                    id="resetButton"
                                    class="btn btn-primary btn-lg w-100">
                                    Update Password
                                </button>

                            </form>

                            <div class="text-center mt-4">
                                <a href="login.html"
                                    class="text-decoration-none">
                                    Back to Login
                                </a>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase-config.js"></script>

    <script>
        const resetForm = document.getElementById("resetForm");
        const resetButton = document.getElementById("resetButton");
        const message = document.getElementById("message");

        let recoveryVerified = false;

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "alert alert-" + type;
        }

        async function initializePasswordReset() {
            resetForm.classList.add("d-none");
            showMessage("Verifying your reset link...", "info");

            try {
                if (typeof db === "undefined" || !db.auth) {
                    throw new Error(
                        "Supabase could not be initialized. Please refresh the page."
                    );
                }

                // Supabase may return an error in the URL fragment.
                const hashParams = new URLSearchParams(
                    window.location.hash.substring(1)
                );

                const queryParams = new URLSearchParams(
                    window.location.search
                );

                const urlError =
                    hashParams.get("error_description") ||
                    hashParams.get("error") ||
                    queryParams.get("error_description") ||
                    queryParams.get("error");

                if (urlError) {
                    throw new Error(
                        "This reset link is invalid or expired. Please request a new password-reset email."
                    );
                }

                // Handle a PKCE verification code when present.
                const code = queryParams.get("code");

                if (code) {
                    const { error } =
                        await db.auth.exchangeCodeForSession(code);

                    if (error) {
                        throw new Error(
                            "The reset link could not be verified. Please request a fresh email."
                        );
                    }

                    // Remove the one-time code from the address bar.
                    window.history.replaceState(
                        {},
                        document.title,
                        window.location.pathname
                    );
                }

                // Supabase JS can also establish the session from a
                // recovery token in the URL fragment.
                const { data, error } = await db.auth.getSession();

                if (error) {
                    throw error;
                }

                if (!data.session) {
                    throw new Error(
                        "No valid reset session was found. Please request a new password-reset email and open its newest link."
                    );
                }

                recoveryVerified = true;
                resetForm.classList.remove("d-none");
                message.className = "alert d-none";

            } catch (error) {
                console.error("Reset-link verification failed:", error);

                showMessage(
                    error.message ||
                    "Unable to verify the reset link. Please request a new one.",
                    "warning"
                );
            }
        }

        resetForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            if (!recoveryVerified) {
                showMessage(
                    "Your reset link has not been verified. Please request a new one.",
                    "danger"
                );
                return;
            }

            const password =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                showMessage(
                    "Your password must contain at least 8 characters.",
                    "danger"
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage(
                    "The passwords do not match.",
                    "danger"
                );
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Updating Password...";

            try {
                const { data, error } = await db.auth.updateUser({
                    password: password
                });

                if (error) {
                    throw error;
                }

                recoveryVerified = false;
                resetForm.reset();
                resetForm.classList.add("d-none");

                showMessage(
                    "Your password has been updated successfully. You can now log in using your new password.",
                    "success"
                );

                // End the current session after the password update.
                await db.auth.signOut();

            } catch (error) {
                console.error("Password update failed:", error);

                showMessage(
                    error.message ||
                    "Unable to update your password. Please request a new reset email.",
                    "danger"
                );

            } finally {
                resetButton.disabled = false;
                resetButton.textContent = "Update Password";
            }
        });

        initializePasswordReset();
    </script>

</body>
</html>
