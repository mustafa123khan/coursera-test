
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MediCare Pharmacy</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-capsule"></i> MediCare Pharmacy
            </a>
        </div>
    </nav>

    <!-- RESET PASSWORD FORM -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">

                    <div class="card shadow border-0">
                        <div class="card-body p-4 p-md-5">

                            <div class="text-center mb-4">
                                <div class="bg-primary text-white rounded-circle
                                    d-inline-flex align-items-center justify-content-center"
                                    style="width:70px;height:70px;">
                                    <i class="bi bi-shield-lock fs-2"></i>
                                </div>

                                <h2 class="fw-bold mt-3">Reset Password</h2>

                                <p class="text-muted">
                                    Enter and confirm your new password.
                                </p>
                            </div>

                            <div id="message" class="alert d-none" role="alert"></div>

                            <form id="resetForm">

                                <div class="mb-3">
                                    <label for="newPassword" class="form-label fw-bold">
                                        New Password
                                    </label>

                                    <input
                                        type="password"
                                        id="newPassword"
                                        class="form-control"
                                        minlength="8"
                                        autocomplete="new-password"
                                        placeholder="Enter new password"
                                        required>
                                    <small class="text-muted">
                                        Use at least 8 characters.
                                    </small>
                                </div>

                                <div class="mb-4">
                                    <label for="confirmPassword" class="form-label fw-bold">
                                        Confirm New Password
                                    </label>

                                    <input
                                        type="password"
                                        id="confirmPassword"
                                        class="form-control"
                                        minlength="8"
                                        autocomplete="new-password"
                                        placeholder="Re-enter new password"
                                        required>
                                </div>

                                <button
                                    type="submit"
                                    id="resetButton"
                                    class="btn btn-primary btn-lg w-100">
                                    Update Password
                                </button>

                            </form>

                            <div class="text-center mt-4">
                                <a href="login.html" class="text-decoration-none">
                                    Back to Login
                                </a>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase-config.js"></script>

    <script>
        const resetForm = document.getElementById("resetForm");
        const resetButton = document.getElementById("resetButton");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "alert alert-" + type;
        }

        // Check whether the password-reset link established a valid session.
        async function checkResetSession() {
            try {
                const { data, error } = await db.auth.getSession();

                if (error || !data.session) {
                    resetForm.classList.add("d-none");
                    showMessage(
                        "This password-reset link is invalid or expired. Please request a new one from the login page.",
                        "warning"
                    );
                }
            } catch (error) {
                console.error("Session check failed:", error);
                resetForm.classList.add("d-none");
                showMessage(
                    "Unable to verify your reset link. Please request a new one.",
                    "danger"
                );
            }
        }

        resetForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const password = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            message.classList.add("d-none");

            if (password.length < 8) {
                showMessage("Your password must contain at least 8 characters.", "danger");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("The passwords do not match.", "danger");
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Updating Password...";

            try {
                const { data: sessionData, error: sessionError } =
                    await db.auth.getSession();

                if (sessionError || !sessionData.session) {
                    showMessage(
                        "Your reset link is invalid or expired. Please request a new email.",
                        "danger"
                    );
                    return;
                }

                const { error } = await db.auth.updateUser({
                    password: password
                });

                if (error) {
                    console.error("Password update failed:", error.message);
                    showMessage(
                        "Unable to update the password. Please request a new reset link and try again.",
                        "danger"
                    );
                    return;
                }

                resetForm.reset();
                resetForm.classList.add("d-none");

                showMessage(
                    "Your password has been updated successfully. You can now log in with your new password.",
                    "success"
                );

            } catch (error) {
                console.error("Unexpected password reset error:", error);
                showMessage("Something went wrong. Please try again.", "danger");
            } finally {
                resetButton.disabled = false;
                resetButton.textContent = "Update Password";
            }
        });

        checkResetSession();
    </script>

</body>
</html>
